# SL18 Render Stack - ConfigMap and Secrets
# Phase 8: Scaling & Deployment

apiVersion: v1
kind: ConfigMap
metadata:
  name: sl18-config
  namespace: sl18
data:
  version: "1.0.0"
  environment: "production"
  storage-provider: "local"
  max-concurrent-renders: "4"
  max-concurrent-publish: "2"
  log-level: "info"

---
# NOTE: This is a TEMPLATE file. Do NOT commit with real secrets.
# Create secrets using kubectl create secret or sealed-secrets:
#
# kubectl create secret generic sl18-secrets \
#   --from-literal=airtable-api-key="YOUR_KEY" \
#   --from-literal=airtable-base-id="YOUR_BASE_ID" \
#   ... -n sl18
#
# Or use external-secrets-operator for production deployments.

apiVersion: v1
kind: Secret
metadata:
  name: sl18-secrets
  namespace: sl18
  annotations:
    description: "Template only - create secrets via kubectl or sealed-secrets"
type: Opaque
stringData:
  # Airtable
  airtable-api-key: "REPLACE_ME"
  airtable-base-id: "REPLACE_ME"
  
  # YouTube
  youtube-api-key: "REPLACE_ME"
  
  # Facebook/Meta
  facebook-access-token: "REPLACE_ME"
  facebook-page-id: "REPLACE_ME"
  
  # Instagram
  instagram-access-token: "REPLACE_ME"
  instagram-user-id: "REPLACE_ME"
  
  # Azure Storage (optional)
  azure-storage-connection-string: "REPLACE_ME"
  
  # AWS S3 (optional)
  aws-access-key-id: "REPLACE_ME"
  aws-secret-access-key: "REPLACE_ME"
