# SL18 Render Stack - ConfigMap and Secrets
# Phase 8: Scaling & Deployment

apiVersion: v1
kind: ConfigMap
metadata:
  name: sl18-config
  namespace: sl18
data:
  version: "1.0.0"
  environment: "production"
  storage-provider: "local"
  max-concurrent-renders: "4"
  max-concurrent-publish: "2"
  log-level: "info"

---
# Note: Secrets should be created manually or via sealed-secrets
# This is a template showing the required secret keys
apiVersion: v1
kind: Secret
metadata:
  name: sl18-secrets
  namespace: sl18
type: Opaque
stringData:
  # Airtable
  airtable-api-key: "${AIRTABLE_API_KEY}"
  airtable-base-id: "${AIRTABLE_BASE_ID}"
  
  # YouTube
  youtube-api-key: "${YOUTUBE_API_KEY}"
  
  # Facebook/Meta
  facebook-access-token: "${FACEBOOK_ACCESS_TOKEN}"
  facebook-page-id: "${FACEBOOK_PAGE_ID}"
  
  # Instagram
  instagram-access-token: "${INSTAGRAM_ACCESS_TOKEN}"
  instagram-user-id: "${INSTAGRAM_USER_ID}"
  
  # Azure Storage (optional)
  azure-storage-connection-string: "${AZURE_STORAGE_CONNECTION_STRING}"
  
  # AWS S3 (optional)
  aws-access-key-id: "${AWS_ACCESS_KEY_ID}"
  aws-secret-access-key: "${AWS_SECRET_ACCESS_KEY}"
