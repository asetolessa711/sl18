# SL18 Render Stack - Persistent Volume Claims
# Phase 8: Scaling & Deployment

apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sl18-renders-pvc
  namespace: sl18
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 100Gi
  storageClassName: standard

