# SL18 Render Stack - Grafana Dashboard Provisioning
# Phase 8: Scaling & Deployment

apiVersion: 1

providers:
  - name: 'SL18 Dashboards'
    orgId: 1
    folder: 'SL18'
    folderUid: 'sl18'
    type: file
    disableDeletion: false
    editable: true
    options:
      path: /etc/grafana/provisioning/dashboards
