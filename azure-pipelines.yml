# Azure DevOps pipeline entry - routes to pipelines/mvp.yml template
trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

variables:
  - group: SL18-Secrets

stages:
  - stage: MVP
    displayName: "SL18 MVP validation"
    jobs:
      - job: Validate
        displayName: "Validate scaffold"
        pool:
          vmImage: "ubuntu-latest"
        steps:
          - checkout: self
          - template: pipelines/mvp.yml
            parameters:
              persona: "Addis Analyst"
              language: "en"
