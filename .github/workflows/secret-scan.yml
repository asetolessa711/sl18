name: Repository Secret Scan

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run secret pattern scan
        run: |
          set -euo pipefail
          echo "[secret-scan] Scanning tracked files for credential patterns"
          # Expanded patterns to mirror local hooks
          PATTERN='(\.apps\.googleusercontent\.com|GOCSPX-|ya29\.|1//[A-Za-z0-9_-]{20,}|-----BEGIN (RSA|EC|DSA|OPENSSH|PGP) PRIVATE KEY-----|-----BEGIN PRIVATE KEY-----|"private_key":|AKIA[0-9A-Z]{16}|ASIA[0-9A-Z]{16}|gh[pousr]_[A-Za-z0-9]{36,}|\b[0-9a-f]{40}\b|xox[baprs]-[A-Za-z0-9-]{10,}|sk_live_[A-Za-z0-9]{24,}|EA[A-Za-z0-9]{10,})'
          files=$(git ls-files)
          if [[ -f .secret-scan-ignore ]]; then
            files=$(printf "%s\n" "$files" | grep -v -F -f .secret-scan-ignore || true)
          fi
          found=0
          while IFS= read -r f; do
            [[ -z "$f" ]] && continue
            if grep -I -E -n -q -- "$PATTERN" "$f"; then
              echo "[secret-scan] Potential secret in $f"
              grep -I -E -n -- "$PATTERN" "$f" | head -n 5
              found=1
            fi
          done <<< "$files"
          if [[ $found -ne 0 ]]; then
            echo "[secret-scan] Failing build due to potential secrets."
            exit 1
          fi
          echo "[secret-scan] No secrets detected."

      - name: Summary
        run: echo "Secret scan completed successfully."